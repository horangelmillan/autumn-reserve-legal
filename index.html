<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn Reserve — Próximamente</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--border:#e7e5e4;--ink:#1c1917;--muted:#57534e;--accent:#c2410c;--accent-soft:#ffedd5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:2.5rem 2rem;text-align:center;max-width:26rem;margin:1rem}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:600;border-radius:9999px;padding:.2rem .8rem;margin-bottom:.75rem}
h1{margin:.25rem 0 .5rem;font-size:1.6rem}
p{color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
<span class="badge">Autumn Reserve</span>
<h1>Próximamente</h1>
<p>Plataforma de gestión de citas por WhatsApp.</p>
<p><a href="/privacy">Política de privacidad</a></p>
</div>
</body>
</html>
